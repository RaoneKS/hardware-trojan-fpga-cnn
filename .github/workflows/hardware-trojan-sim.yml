name: Hardware Trojan simulation

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: hardware-trojan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rtl-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Run full 10-workload x 6-target regression
        run: |
          chmod +x verification/run_full_matrix.sh
          ./verification/run_full_matrix.sh

      - name: Run evidence-bounded ablation and stealthiness analysis
        run: |
          python3 verification/analyze_ablation_stealthiness.py

      - name: Check manuscript citations and professor figures
        run: python3 scripts/check_paper_sources.py

      - name: Build and verify professor submission ZIP
        if: success()
        run: bash professor_submission/build_submission_zip.sh

      - name: Publish professor submission package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hardware-trojan-professor-submission
          path: Hardware_Trojan_FPGA_CNN_Professor_Submission.zip

      - name: Publish simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardware-trojan-simulation-evidence
          path: |
            verification/results/full_matrix/**
            verification/results/runs.csv
            verification/results/METRICS_SUMMARY.md
            verification/results/ablation_summary.csv
            verification/results/stealthiness_sensitivity.csv
            verification/results/ABLATION_STEALTHINESS_REPORT.md
            paper/figures/figure22_professor.svg
            paper/figures/figure25_professor.svg
