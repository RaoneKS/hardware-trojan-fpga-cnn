name: Hardware Trojan simulation

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  rtl-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Run full 10-workload x 6-target regression
        run: |
          chmod +x verification/run_full_matrix.sh
          ./verification/run_full_matrix.sh

      - name: Publish simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardware-trojan-simulation-evidence
          path: |
            verification/results/*_simulation.log
            verification/results/*_simulation_summary.csv
            verification/results/*_activity.csv
            verification/results/*_activity_summary.txt
            verification/results/simulation_summary.csv
            verification/results/multiworkload/*
          if-no-files-found: ignore
