name: Hardware Trojan simulation

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  rtl-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Run controlled Trojan simulations
        run: |
          chmod +x verification/run_all.sh
          ./verification/run_all.sh
