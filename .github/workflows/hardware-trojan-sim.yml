name: Hardware Trojan simulation

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  rtl-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Run controlled Trojan simulations
        run: |
          chmod +x verification/run_all.sh
          ./verification/run_all.sh

      - name: Publish simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardware-trojan-simulation-evidence
          path: |
            verification/results/*_simulation.log
            verification/results/simulation_summary.csv
          if-no-files-found: ignore
