name: Hardware Trojan simulation

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  rtl-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Run healthy baseline regression
        run: |
          chmod +x verification/run_healthy.sh verification/run_all.sh
          ./verification/run_healthy.sh

      - name: Analyze healthy switching activity
        run: |
          python3 verification/analyze_vcd_activity.py \
            verification/results/healthy.vcd \
            verification/results/healthy_activity.csv \
            | tee verification/results/healthy_activity_summary.txt

      - name: Run controlled Trojan simulations
        run: |
          ./verification/run_all.sh

      - name: Publish simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardware-trojan-simulation-evidence
          path: |
            verification/results/*_simulation.log
            verification/results/*_simulation_summary.csv
            verification/results/*_activity.csv
            verification/results/*_activity_summary.txt
            verification/results/simulation_summary.csv
          if-no-files-found: ignore
