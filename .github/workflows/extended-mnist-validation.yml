name: Extended MNIST validation

on:
  workflow_dispatch:
  push:
    paths:
      - verification/generate_extended_workloads.py
      - verification/run_extended_matrix.sh
      - verification/analyze_extended_matrix.py
      - .github/workflows/extended-mnist-validation.yml

concurrency:
  group: extended-mnist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extended-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Run 50-input x 6-target regression
        run: |
          chmod +x verification/run_extended_matrix.sh
          ./verification/run_extended_matrix.sh
      - name: Publish extended evidence
        uses: actions/upload-artifact@v4
        with:
          name: extended-mnist-validation
          path: |
            verification/results/extended_runs.csv
            verification/results/EXTENDED_MATRIX_REPORT.md
