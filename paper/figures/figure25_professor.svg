<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500"><rect width="100%" height="100%" fill="white"/><text x="450" y="45" text-anchor="middle" font-family="Arial" font-size="26" font-weight="bold">Fig. 25. Stealthiness Sensitivity</text><g font-family="Arial" font-size="18"><rect x="120" y="140" width="660" height="210" fill="white" stroke="#333"/><text x="450" y="205" text-anchor="middle">No trigger-probability / payload-severity sweep was performed.</text><text x="450" y="245" text-anchor="middle">The 10-workload matrix demonstrates classification invariance</text><text x="450" y="275" text-anchor="middle">for the selected controlled Trojans, but is not a stealthiness curve.</text><text x="450" y="320" text-anchor="middle">This remains an explicitly documented extension.</text></g></svg>